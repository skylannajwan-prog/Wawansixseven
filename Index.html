<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Download</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #101827, #263b5b);
    }

    .download-button {
      display: inline-block;
      padding: 16px 34px;
      border-radius: 12px;
      background: #4f8cff;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .download-button:hover {
      background: #3477ee;
      transform: translateY(-2px);
    }

    .download-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <!-- Ganti URL_KAMU di bawah dengan link tujuan -->
  <a class="download-button" href="https://xhamster.com">link download</a>
</body>
</html>
